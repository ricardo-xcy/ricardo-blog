<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ricardo 的博客</title>
<meta name="description" content="ricardo 的个人博客，在厦门，写点东西。" />
<link rel="alternate" type="application/rss+xml" title="ricardo 的博客" href="/feed.xml" />
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="assets/theme.js"></script>
<style>
  :root {
    --bg: #faf8f4; --text: #262626; --muted: #8a8378; --card: #ffffff;
    --border: #e8e2d8; --accent: #b4552d; --accent-soft: #f6e8df;
    --link: #1a6fd4; --shadow: rgba(60, 40, 20, 0.08);
  }
  html[data-theme="dark"] {
    --bg: #171512; --text: #e8e6e1; --muted: #a39e94; --card: #211e1a;
    --border: #35322c; --accent: #e08a5c; --accent-soft: #2e241c;
    --link: #9ecbff; --shadow: rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    line-height: 1.8; color: var(--text); background: var(--bg);
    max-width: 720px; margin: 0 auto; padding: 28px 20px 64px;
    transition: background 0.3s, color 0.3s;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  #progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--accent); z-index: 100; transition: width 0.1s linear; }

  header { margin-bottom: 24px; }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; }
  header h1 { font-size: 32px; letter-spacing: 1px; line-height: 1.2; }
  header h1 a { color: var(--text); }
  header h1 a:hover { text-decoration: none; }
  header .tagline { color: var(--muted); margin-top: 6px; }
  #theme-btn {
    flex-shrink: 0; margin-left: 16px; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-size: 13px; cursor: pointer; font-family: inherit;
  }
  #theme-btn:hover { border-color: var(--accent); }
  nav { margin-top: 16px; font-size: 14px; }
  nav a { margin-right: 18px; color: var(--muted); }
  nav a:hover { color: var(--accent); }

  .hero { margin-bottom: 28px; }
  .hero img { width: 100%; border-radius: 14px; display: block; box-shadow: 0 6px 24px var(--shadow); }
  .hero figcaption { font-size: 13px; color: var(--muted); margin-top: 8px; }

  #search {
    width: 100%; padding: 11px 16px; font-size: 15px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-family: inherit; outline: none; margin-bottom: 14px;
  }
  #search:focus { border-color: var(--accent); }
  #tags { margin-bottom: 8px; }
  .chip {
    display: inline-block; padding: 3px 12px; margin: 0 8px 8px 0; font-size: 13px;
    border-radius: 999px; border: 1px solid var(--border); background: var(--card);
    color: var(--muted); cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  h2.section { font-size: 18px; margin: 28px 0 6px; }
  .post {
    padding: 18px 20px; margin-top: 14px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--card); cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  }
  .post:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--shadow); }
  .post:hover h3 { color: var(--accent); }
  .post h3 { font-size: 19px; line-height: 1.5; }
  .post .meta { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .post p { color: var(--muted); font-size: 15px; }
  .post .tag { display: inline-block; font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 9px; margin: 8px 6px 0 0; }
  .empty { color: var(--muted); padding: 24px 0; }

  #article { display: none; }
  #article h1 { font-size: 27px; line-height: 1.4; margin-bottom: 8px; }
  #article .meta { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  #article .meta .tag { display: inline-block; font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 9px; margin-left: 6px; }
  #article .body { font-size: 16.5px; }
  #article .body h2 { font-size: 20px; margin: 28px 0 10px; }
  #article .body h3 { font-size: 17px; margin: 22px 0 8px; }
  #article .body p { margin-bottom: 14px; }
  #article .body ul, #article .body ol { margin: 0 0 14px 22px; }
  #article .body li { margin-bottom: 6px; }
  #article .body img { max-width: 100%; border-radius: 8px; cursor: zoom-in; }
  #article .body blockquote { border-left: 3px solid var(--border); padding-left: 14px; color: var(--muted); margin-bottom: 14px; }
  #article .body a { word-break: break-all; }
  .back { display: inline-block; margin-bottom: 20px; cursor: pointer; color: var(--link); background: none; border: none; font-size: 15px; padding: 0; font-family: inherit; }

  #toc-wrap { margin-bottom: 22px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); font-size: 14.5px; }
  #toc-wrap summary { cursor: pointer; font-weight: 600; }
  #toc-wrap ul { margin: 8px 0 0 18px; }
  #toc-wrap li { margin-bottom: 4px; }
  #toc-wrap a { color: var(--text); }
  #toc-wrap a:hover { color: var(--accent); }

  #related { margin-top: 36px; }
  #related h3 { font-size: 17px; margin-bottom: 6px; }
  #related-list .rel { padding: 12px 0; border-top: 1px solid var(--border); cursor: pointer; }
  #related-list .rel:hover h4 { color: var(--accent); }
  #related-list h4 { font-size: 16px; line-height: 1.5; }
  #related-list .meta { font-size: 13px; color: var(--muted); }

  #post-nav { margin-top: 28px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  #post-nav a { font-size: 14.5px; max-width: 48%; }

  .share-row { margin: 32px 0 8px; padding-top: 20px; border-top: 1px solid var(--border); }
  #copy-btn {
    padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 14px; cursor: pointer; font-family: inherit;
  }
  #copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  #giscus { margin-top: 32px; }

  #lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88); display: none; align-items: center; justify-content: center; z-index: 200; cursor: zoom-out; padding: 20px; }
  #lightbox img { max-width: 100%; max-height: 90vh; border-radius: 8px; }

  footer { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }
  footer .row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--accent); }
  #stats { margin-top: 8px; }

  #top-btn {
    position: fixed; right: 20px; bottom: 24px; width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-size: 18px; cursor: pointer; display: none; box-shadow: 0 4px 16px var(--shadow); z-index: 90;
  }
  #top-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div id="progress"></div>

<header>
  <div class="header-top">
    <div>
      <h1><a href="#" id="home-link">ricardo</a></h1>
      <p class="tagline">在厦门，写点东西。</p>
    </div>
    <button id="theme-btn" type="button" aria-label="切换深色 / 浅色模式"></button>
  </div>
  <nav>
    <a href="#" id="nav-home">首页</a>
    <a href="/feed.xml">RSS 订阅</a>
    <a href="/admin/">写文章</a>
  </nav>
</header>

<main id="list-view">
  <figure class="hero">
    <img src="images/kinmen.webp" alt="莒光楼与对岸的厦门" />
    <figcaption>莒光楼与对岸的厦门——一水之隔。</figcaption>
  </figure>

  <input id="search" type="search" placeholder="搜索文章…" autocomplete="off" />
  <div id="tags"></div>

  <h2 class="section">文章</h2>
  <div id="post-list"><p class="empty">加载中……</p></div>
</main>

<article id="article">
  <button class="back" id="back-btn">← 返回文章列表</button>
  <h1 id="article-title"></h1>
  <div class="meta" id="article-meta"></div>
  <div id="toc-wrap" style="display:none">
    <details open>
      <summary>本页目录</summary>
      <ul id="toc"></ul>
    </details>
  </div>
  <div class="body" id="article-body"></div>
  <div id="related" style="display:none">
    <h3>相关阅读</h3>
    <div id="related-list"></div>
  </div>
  <div id="post-nav"></div>
  <div class="share-row">
    <button id="copy-btn" type="button">复制文章链接</button>
  </div>
  <div id="giscus"></div>
</article>

<footer>
  <div class="row">
    <span>ricardo · xcy1.de5.net</span>
    <span><a href="/feed.xml">RSS</a> · <a href="/admin/">写文章</a> · Powered by Netlify</span>
  </div>
  <div id="stats">本站总访问量 <span id="busuanzi_value_site_pv">…</span> · 访客 <span id="busuanzi_value_site_uv">…</span></div>
</footer>

<button id="top-btn" type="button" title="回到顶部">↑</button>
<div id="lightbox"><img alt="放大查看" /></div>

<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script src="assets/main.js"></script>
</body>
</html>
