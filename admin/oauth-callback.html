<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https:; connect-src 'self' https://unpkg.com https://api.github.com https://wdmmuvbebiujujmtydid.supabase.co; font-src 'self' data: https://unpkg.com; frame-src 'self' https://giscus.app" />
  <meta name="robots" content="noindex" />
  <title>登录完成</title>
</head>
<body>
  <p>登录完成，可以关闭此窗口。</p>
  <script>
    var msg = "";
    try { msg = decodeURIComponent(location.hash.slice(1)); } catch (e) { msg = location.hash.slice(1); }
    function mobileFallback() {
      try {
        var token = null;
        var prefix = "authorization:github:success:";
        if (msg && msg.indexOf(prefix) === 0) {
          var jsonStr = msg.slice(prefix.length);
          var data = JSON.parse(jsonStr);
          token = data.token;
        } else if (msg) {
          try {
            var data2 = JSON.parse(msg);
            token = data2.token;
          } catch (e) {}
        }
        if (token) {
          var user = {
            token: token,
            backendName: "github"
          };
          localStorage.setItem("netlify-cms-user", JSON.stringify(user));
        }
      } catch (e) {}
      location.replace("/admin/");
    }
    var replied = false;
    function receiveMessage(e) {
      replied = true;
      window.opener.postMessage(msg, e.origin);
    }
    if (window.opener && msg) {
      window.addEventListener("message", receiveMessage, false);
      window.opener.postMessage("authorizing:github", "*");
      setTimeout(function() {
        if (!replied) {
          mobileFallback();
        }
      }, 2000);
    } else if (msg) {
      mobileFallback();
    }
  </script>
</body>
</html>
